# v0.20 PRE-REGISTRATION: deterministic memory/age-decay ablation.
# Frozen before the first run on the real matrix.

version: denn-memory-ablation-1
parent_report: tier_a_features
baseline_features:
  - spread_2y_z60
  - spread_10y_z60
  - brent_asinh_change_20d
  - wti_asinh_change_20d
  - vix_z60
  - eurusd_momentum_20d
  - bk5_z60
  - bk10_z60
  - nfci_z60
  - anfci_z60
  - h41_tga_ratio_z252
  - h41_rrp_ratio_z252
  - h41_reserves_ratio_z252
  - spx_ret_20d
  - eu_ret_20d
  - gold_ret_20d

# Direct deterministic EMA states already generated by denn-baseline.
direct_memory_features:
  - memory_spread_2y
  - memory_spread_10y
  - memory_brent
  - memory_wti
  - memory_vix
  - memory_eurusd

# Sparse release states decay toward zero as their known value ages. Age is
# calendar days since modeled availability; half-lives are fixed priors and
# are not optimized on the test folds.
decayed_features:
  - {name: decay_bk5_30d, value: bk5_z60, age: bk5_z60__age_days, half_life_days: 30}
  - {name: decay_bk10_30d, value: bk10_z60, age: bk10_z60__age_days, half_life_days: 30}
  - {name: decay_nfci_14d, value: nfci_z60, age: nfci_z60__age_days, half_life_days: 14}
  - {name: decay_anfci_14d, value: anfci_z60, age: anfci_z60__age_days, half_life_days: 14}
  - {name: decay_h41_tga_14d, value: h41_tga_ratio_z252, age: h41_tga_ratio_z252__age_days, half_life_days: 14}
  - {name: decay_h41_rrp_14d, value: h41_rrp_ratio_z252, age: h41_rrp_ratio_z252__age_days, half_life_days: 14}
  - {name: decay_h41_reserves_14d, value: h41_reserves_ratio_z252, age: h41_reserves_ratio_z252__age_days, half_life_days: 14}

horizons: [1, 5, 20, 60]
ridge_lambdas: [0.01, 0.1, 1.0, 10.0]
minimum_train_rows: 750
minimum_validation_rows: 100
minimum_test_rows: 40
sample:
  method: same_complete_case_as_grouped_tier_a
  expected_start_not_before: 2007-05-04
  no_imputation: true

comparison:
  baseline: observed_state_16
  treatment: observed_state_16_plus_13_memory_decay_features
  fold_statistic: baseline_mse_minus_treatment_mse
  positive_direction: memory_improves
multiplicity:
  alpha: 0.05
  method: bonferroni_over_horizons
  family_size: 4
sign_test: paired_sign_test_over_folds
bootstrap:
  reps: 1000
  seed: 42
  statistic: mean_paired_fold_improvement

strict_pit_eligible: false
inference_status: non_strict_memory_ablation_current_history_without_vintages
