[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-causal-lab"
version = "0.16.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "httpx>=0.27,<1", "pydantic>=2.9,<3", "duckdb>=1,<2", "markdown>=3.7,<4", "networkx>=3.3,<4", "pyyaml>=6,<7", "pytz>=2025", "tzdata>=2026.4", "xlrd>=2.0.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fxlab = "fxlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fxlab = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
